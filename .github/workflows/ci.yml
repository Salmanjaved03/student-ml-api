name: CI Pipeline

# Runs on Pull Requests targeting main (Part 5)
on:
  pull_request:
    branches:
      - main

jobs:
  test-and-validate:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      # 1. Code Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python Setup
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Dependency Installation
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Unit Tests
      - name: Run unit tests
        run: pytest tests/ -v

      # 5. Docker Build Validation (build only, no push)
      - name: Validate Docker build
        run: docker build -t student-ml-api:ci-test .
